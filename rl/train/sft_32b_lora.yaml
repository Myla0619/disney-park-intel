# LLaMA-Factory SFT 配置 —— 阶段二：Qwen3-32B 正式冷启动（4×A100 80G）
# 启动：FORCE_TORCHRUN=1 llamafactory-cli train rl/train/sft_32b_lora.yaml
# 7B 链路验证通过后再上，超参先继承 7B 验证结论

### model
model_name_or_path: Qwen/Qwen3-32B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05

### dataset
dataset_dir: data/rl/llamafactory
dataset: park_sft_easy_medium      # 第二轮换 park_sft_all（课程学习）
template: qwen3                    # Qwen3 模板；旧版 LLaMA-Factory 用 qwen
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: outputs/sft-32b-lora
logging_steps: 5
save_steps: 100
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
deepspeed: examples/deepspeed/ds_z3_config.json   # LLaMA-Factory 自带的 ZeRO-3 配置

### eval
val_size: 0.05
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
