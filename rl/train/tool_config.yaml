# veRL 多轮 rollout 的工具配置模板 [CHECK: 字段名对照所装 veRL 版本的 tool schema]
# 语义：rollout worker 解析模型输出的 <tool_call>，POST 到工具环境服务 /call，
# 把返回 JSON 包成 <tool_response> 拼回上下文。
# 工具清单与参数 schema 从 GET http://localhost:8100/tools 动态拉取即可，
# 不要在这里手抄一份（会和注册表漂移）。

tools:
  - class_name: "http_tool"          # 若所装版本无通用 http tool，用 reward_bridge 同款
                                     # urllib 写一个 ~30 行的自定义 Tool 类，指到 /call
    config:
      endpoint: "http://localhost:8100/call"
      registry_endpoint: "http://localhost:8100/tools"
      mode: "sandbox"                # rollout 全走沙箱：零成本、可复现、无 QPS 限制
      timeout_s: 30
