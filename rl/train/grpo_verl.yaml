# veRL GRPO 配置模板 —— Qwen3-32B 在线 RL（8×A100 80G / 8×H800）
#
# ⚠️ 这是模板：veRL 迭代快，字段名以租卡机器上实际安装的版本为准
#    （对照 verl/trainer/config/ppo_trainer.yaml），标 [CHECK] 的项装好后核对。
# 启动（示例）：
#   npm run env:serve &                       # 工具环境 + reward 服务（sandbox）
#   python -m verl.trainer.main_ppo \
#     --config-path rl/train --config-name grpo_verl <overrides...>
#
# 7B 试跑：把 model.path 换成 SFT 后的 7B merge 权重，2×A100 即可，先验证链路。

data:
  train_files: data/rl/seeds_augmented.jsonl        # 每行含 query/profile/category
  # 预处理时把整条 SeedTask 塞进 extra_info.task（reward_bridge 依赖）[CHECK]
  train_batch_size: 64
  max_prompt_length: 4096
  max_response_length: 8192                         # 多轮工具调用展开后的总预算

algorithm:
  adv_estimator: grpo                               # GRPO：组内相对优势，免 critic
  use_kl_in_reward: false
  kl_ctrl:
    kl_coef: 0.001                                  # KL 约束：防 reward hack 的最后防线

actor_rollout_ref:
  model:
    path: outputs/sft-32b-merged                    # SFT LoRA merge 后的权重
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 1.0e-6
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1
    use_kl_loss: true                               # GRPO 风格：KL 进 loss
    kl_loss_coef: 0.001
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  rollout:
    name: sglang                                    # 多轮+工具调用 rollout 用 sglang [CHECK]
    n: 8                                            # GRPO 组大小：每题采样 8 条
    temperature: 1.0
    gpu_memory_utilization: 0.6
    multi_turn:                                     # veRL agentic/multi-turn 配置 [CHECK]
      enable: true
      max_turns: 30
      tool_config_path: rl/train/tool_config.yaml   # 指向工具环境 HTTP 服务
  ref:
    fsdp_config:
      param_offload: true

custom_reward_function:
  path: rl/train/reward_bridge.py                   # POST http://localhost:8100/reward
  name: compute_score

trainer:
  total_epochs: 2
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 20
  test_freq: 10
  project_name: park-intel-rl
  experiment_name: grpo-32b
  logger: ["console", "wandb"]

# 课程学习执行方式：
#   第一阶段 train_files 用 easy+medium 子集 + PARK_REWARD_PHASE=early
#   第二阶段全量 + PARK_REWARD_PHASE=mid，收敛后 late
