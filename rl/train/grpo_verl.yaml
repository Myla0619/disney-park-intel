# Canonical full-parameter, full-episode GRPO. Pinned veRL API; no adapters/quantization.
defaults:
  - ppo_trainer
  - _self_

data:
  train_files: data/rl/verl/train-mid.parquet
  val_files: data/rl/verl/validation.parquet
  train_batch_size: 16
  max_prompt_length: 4096
  max_response_length: 8192
  return_raw_chat: true
  filter_overlong_prompts: true
  truncation: error

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

actor_rollout_ref:
  model:
    path: outputs/full-sft-late
    lora_rank: 0
    lora_adapter_path: null
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp
    optim:
      lr: 1.0e-6
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  rollout:
    name: vllm
    n: 8
    temperature: 1.0
    tensor_model_parallel_size: 8
    gpu_memory_utilization: 0.5
    log_prob_micro_batch_size_per_gpu: 1
    agent:
      default_agent_loop: park_agent
      agent_loop_config_path: rl/train/agent_loop.yaml
      num_workers: 4
    custom:
      environment_url: http://127.0.0.1:8100
      max_turns: 30
      max_calls: 25
    val_kwargs:
      n: 1
      temperature: 0.0
      do_sample: false
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true

trainer:
  total_epochs: 1
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 20
  test_freq: 10
  val_before_train: true
  project_name: park-full-grpo
  experiment_name: mid
  resume_mode: disable
  default_local_dir: outputs/grpo-mid
  rollout_data_dir: outputs/grpo-mid/rollouts
  validation_data_dir: outputs/grpo-mid/validation
  logger: [console]
