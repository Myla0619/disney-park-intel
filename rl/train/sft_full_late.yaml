# Canonical full-parameter SFT curriculum; budgets are starting configuration, not results.
model_name_or_path: outputs/full-sft-mid
trust_remote_code: false
stage: sft
do_train: true
finetuning_type: full
dataset_dir: data/rl/full_sft
dataset: park_late
eval_dataset: park_validation
template: qwen
cutoff_len: 8192
train_on_prompt: false
mask_history: false
packing: false
overwrite_cache: false
preprocessing_num_workers: 8
output_dir: outputs/full-sft-late
overwrite_output_dir: false
logging_steps: 5
save_steps: 50
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 3.0e-6
max_steps: 100
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
deepspeed: rl/train/deepspeed_zero3.json
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 25
report_to: none
