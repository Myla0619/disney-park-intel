# LLaMA-Factory SFT 配置 —— 阶段一：7B 链路验证（1×A100 80G 或 2×4090 可跑）
# 启动：llamafactory-cli train rl/train/sft_7b_lora.yaml
# 课程学习：先用 park_sft_easy_medium 训一轮，再换 park_sft_all 继续训

### model
model_name_or_path: Qwen/Qwen2.5-7B-Instruct   # 也可换 Qwen3-8B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### dataset（先跑 python rl/train/convert_sft.py --difficulty easy medium）
dataset_dir: data/rl/llamafactory
dataset: park_sft_easy_medium
template: qwen
cutoff_len: 8192            # 与硬件匹配，稳步外推；不要一上来拉满
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: outputs/sft-7b-lora
logging_steps: 5
save_steps: 100
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true

### eval
val_size: 0.05
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 100
